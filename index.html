<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: #0f0; font-family: monospace;
      overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
    #log {
      position: absolute; top: 10px; left: 10px; right: 10px;
      font-size: 13px; pointer-events: none; white-space: pre-wrap; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="log">Starting Chocolate Doom...</div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += '\n' + msg; }

    window.onerror = (msg, src, line) => log('[ERR] ' + msg + ' @ line ' + line);
    window.onunhandledrejection = (e) => log('[PROMISE] ' + e.reason);

    async function start() {
      try {
        log('1. Fetching WASM, WAD, and CFG...');
        const [wasmRes, wadRes, cfgRes] = await Promise.all([
          fetch('chocolate-doom.wasm'),
          fetch('DOOM1.WAD'),
          fetch('default.cfg')
        ]);

        if (!wasmRes.ok) throw new Error('WASM HTTP ' + wasmRes.status);
        if (!wadRes.ok) throw new Error('DOOM1.WAD HTTP ' + wadRes.status);
        if (!cfgRes.ok) throw new Error('default.cfg HTTP ' + cfgRes.status);

        const [wasmBytes, wadBuf, cfgBuf] = await Promise.all([
          wasmRes.arrayBuffer(),
          wadRes.arrayBuffer(),
          cfgRes.arrayBuffer()
        ]);

        const wadBytes = new Uint8Array(wadBuf);
        const cfgBytes = new Uint8Array(cfgBuf);
        log('2. All downloaded (WAD: ' + wadBytes.length + ' B, CFG: ' + cfgBytes.length + ' B).');

        window.Module = {
          wasmBinary: wasmBytes,
          canvas: document.getElementById('canvas'),
          arguments: ['-iwad', 'DOOM1.WAD', '-config', 'default.cfg'],
          print: (t) => log('[DOOM] ' + t),
          printErr: (t) => log('[DOOM ERR] ' + t),
          preRun: [
            function() {
              log('3. Writing files to virtual FS...');
              FS.writeFile('/DOOM1.WAD', wadBytes);
              FS.writeFile('/default.cfg', cfgBytes);
              log('4. Files mounted! Calling main()...');
            }
          ],
          onRuntimeInitialized: function() {
            log('5. Runtime initialized!');
            setTimeout(() => { logEl.style.display = 'none'; }, 2000);
          }
        };

        log('2b. Loading chocolate-doom.js...');
        const s = document.createElement('script');
        s.src = 'chocolate-doom.js';
        document.body.appendChild(s);
      } catch (e) {
        log('[FAIL] ' + e.message);
      }
    }

    start();
  </script>
</body>
</html>
