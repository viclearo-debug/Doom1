<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: #0f0; font-family: monospace;
      overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
    #log {
      position: absolute; top: 10px; left: 10px; right: 10px;
      font-size: 13px; pointer-events: none; white-space: pre-wrap; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="log">1. Initializing Module...</div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += '\n' + msg; }

    window.onerror = (msg, src, line) => log('[ERR] ' + msg + ' @ line ' + line);
    window.onunhandledrejection = (e) => log('[PROMISE] ' + e.reason);

    var Module = {
      canvas: document.getElementById('canvas'),
      noInitialRun: true,
      print: (t) => log('[DOOM] ' + t),
      printErr: (t) => log('[DOOM ERR] ' + t),
      onRuntimeInitialized: async function() {
        try {
          log('2. WASM Runtime ready! Fetching DOOM1.WAD & default.cfg...');
          const [wadRes, cfgRes] = await Promise.all([
            fetch('DOOM1.WAD'),
            fetch('default.cfg')
          ]);
          if (!wadRes.ok) throw new Error('DOOM1.WAD HTTP ' + wadRes.status);
          if (!cfgRes.ok) throw new Error('default.cfg HTTP ' + cfgRes.status);

          const wadBytes = new Uint8Array(await wadRes.arrayBuffer());
          const cfgBytes = new Uint8Array(await cfgRes.arrayBuffer());
          log('3. Downloaded WAD (' + wadBytes.length + ' B). Writing to FS...');

          if (typeof Module.FS_createDataFile === 'function') {
            Module.FS_createDataFile('/', 'DOOM1.WAD', wadBytes, true, true, true);
            Module.FS_createDataFile('/', 'default.cfg', cfgBytes, true, true, true);
          } else if (typeof FS !== 'undefined') {
            FS.writeFile('/DOOM1.WAD', wadBytes);
            FS.writeFile('/default.cfg', cfgBytes);
          } else {
            throw new Error('No FS API exposed on Module or global scope');
          }

          log('4. Calling Module.callMain()...');
          setTimeout(() => { logEl.style.display = 'none'; }, 2000);
          Module.callMain(['-iwad', 'DOOM1.WAD', '-config', 'default.cfg']);
        } catch (err) {
          log('[FAIL] ' + err.message);
        }
      }
    };
  </script>
  <script src="chocolate-doom.js"></script>
</body>
</html>
