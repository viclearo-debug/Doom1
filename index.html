<<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #000; color: #0f0; font-family: monospace;
      overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
    #log {
      position: absolute; top: 10px; left: 10px; right: 10px;
      font-size: 13px; pointer-events: none; white-space: pre-wrap; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="log">1. Starting Chocolate Doom...</div>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    const logEl = document.getElementById('log');
    function log(msg) { logEl.textContent += '\n' + msg; }

    window.onerror = (msg, src, line) => log('[ERR] ' + msg + ' @ line ' + line);

    var Module = {
      canvas: document.getElementById('canvas'),
      arguments: ['-iwad', 'DOOM1.WAD', '-config', 'default.cfg'],
      print: (t) => log('[DOOM] ' + t),
      printErr: (t) => log('[DOOM] ' + t),
      preRun: [
        function() {
          log('2. Pausing boot to download DOOM1.WAD & default.cfg...');
          Module.addRunDependency('wad-files');

          Promise.all([
            fetch('DOOM1.WAD').then(r => r.arrayBuffer()),
            fetch('default.cfg').then(r => r.arrayBuffer())
          ]).then(([wadBuf, cfgBuf]) => {
            const wadBytes = new Uint8Array(wadBuf);
            const cfgBytes = new Uint8Array(cfgBuf);

            if (typeof Module.FS_createDataFile === 'function') {
              Module.FS_createDataFile('/', 'DOOM1.WAD', wadBytes, true, true, true);
              Module.FS_createDataFile('/', 'default.cfg', cfgBytes, true, true, true);
            } else {
              FS.writeFile('/DOOM1.WAD', wadBytes);
              FS.writeFile('/default.cfg', cfgBytes);
            }

            log('3. Files mounted! Resuming Chocolate Doom...');
            setTimeout(() => { logEl.style.display = 'none'; }, 2000);
            Module.removeRunDependency('wad-files');
          }).catch(err => {
            log('[FAIL] ' + err.message);
          });
        }
      ]
    };
  </script>
  <script src="chocolate-doom.js"></script>
</body>
</html>
