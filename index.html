<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 16px; background: #000; color: #0f0; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <div id="out">Reading chocolate-doom.js header & footer...</div>
  <script>
    fetch('chocolate-doom.js')
      .then(r => r.text())
      .then(txt => {
        document.getElementById('out').textContent =
          'LENGTH: ' + txt.length + '\n\n' +
          '--- START ---\n' + txt.slice(0, 400) + '\n\n' +
          '--- END ---\n' + txt.slice(-400);
      })
      .catch(e => {
        document.getElementById('out').textContent = 'ERR: ' + e;
      });
  </script>
</body>
</html>
